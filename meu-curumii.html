<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curumii - Meu Curumii</title>
    <link rel="icon" type="image/png" href="imagens/curumii-icon.png">
    
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    
    <link rel="stylesheet" type="text/css" href="css/modal.css">

    <style>
        .filters {
          display: none; /* Esconde todo o bloco de filtros no meu-curumii.html */
        }
        
        /* Apenas a seção de filtros selecionados será visível */
        .meu-curumii-filtros-selecionados {
            background: #292d46;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .meu-curumii-filtros-selecionados h3 {
            color: #c4f3a9;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        /* Ajuste para alinhar as tags carregadas */
        .meu-curumii-filtros-selecionados .selected-filters ul {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 10px;
        }
    </style> 
</head>
<body>
    <div class="container">
        
        <nav>
            <ul>
                <li><a class="ativo" href="meu-curumii.html">Meu Curumii</a></li>
                <li><a href="perfil-2.html">Perfil</a></li>
                <li><a href="relatorio.html">Relatório</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>

        <div class="header">
            <div class="img-logo-home"><img src="imagens/logo_anima.gif"></div>
            <h1 class="site-subtitle">Curadoria de Conteúdos Infantis</h1>
            <h2 class="page-title">Meu Curumii</h2>
        </div>

        <div class="meu-curumii-filtros-selecionados">
            <h3>Filtros</h3>
            <div class="selected-filters">
                <ul>
                    <li style="color: #999; font-style: italic; list-style: none;">Carregando filtros...</li>
                </ul>
            </div>
            <a href="perfil-2.html" class="link-editar-filtros">Editar ou Limpar Filtros</a>
        </div>


        <div class="filters">
            <div class="main-filter-section"> 
                <input type="text"  id="searchBox" placeholder="Pesquisar por título ou descrição...">
            </div>
            
            <div class="filter-group">
                <div class="filter-item">
                    <label for="filterDuracao">Duração</label>
                    <select id="filterDuracao">
                        <option value="">Todas</option>
                        <option value="curta">Menos de 30 minutos</option>
                        <option value="media">Entre 30 minutos e 1 hora</option>
                        <option value="longa">Mais de 1 hora</option>
                    </select>
                </div>
                
                <div class="filter-item">
                    <label>Gênero</label>
                    <div class="dropdown-genero">
                        <div class="dropdown-toggle" id="generoToggle" onclick="toggleGeneroDropdown()">
                            <span id="generoLabel">Todos os Gêneros</span>
                            <span>▼</span>
                        </div>
                        <div class="dropdown-menu" id="generoDropdown">
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-todos" value="Todos" onchange="updateGeneroFilter(true)">
                                <label for="genero-todos"><strong>Todos</strong></label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-arte" value="Arte" onchange="updateGeneroFilter()">
                                <label for="genero-arte">Arte</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-aventura" value="Aventura" onchange="updateGeneroFilter()">
                                <label for="genero-aventura">Aventura</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-educativo" value="Educativo" onchange="updateGeneroFilter()">
                                <label for="genero-educativo">Educativo</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-fantasia" value="Fantasia" onchange="updateGeneroFilter()">
                                <label for="genero-fantasia">Fantasia</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="genero-musical" value="Musical" onchange="updateGeneroFilter()">
                                <label for="genero-musical">Musical</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="filter-item">
                    <label for="filterIdade">Classificação Etária</label>
                    <select id="filterIdade">
                        <option value="">Todas as Idades</option>
                        <option value="Livre">Livre</option>
                        <option value="10">10 anos</option>
                        <option value="12">12 anos</option>
                        <option value="14">14 anos</option>
                        <option value="16">16 anos</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="filterPlataforma">Plataforma</label>
                    <select id="filterPlataforma">
                        <option value="">Todas</option>
                        <option value="Netflix">Netflix</option>
                        <option value="Disney+">Disney+</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="HBO Max">HBO Max</option>
                        <option value="Globoplay">Globoplay</option>
                        <option value="Apple TV">Apple TV</option>
                        <option value="YouTube">YouTube</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="filterLuz">Sensibilidade à Luz</label>
                    <select id="filterLuz">
                        <option value="">Todas</option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>
            
            <div class="selected-filters" style="display:none;"><ul></ul></div>
            <button class="btn-clear">Limpar Filtros</button>
        </div>
        
        <div class="results-info" id="resultsInfo"></div>
        <div id="loading" class="loading">Carregando dados...</div>
        <div id="itemsContainer" class="items-grid"></div>
        
    </div>

       <div id="videoModal" class="modal" aria-hidden="true">
            <div class="modal-conteudo-video">
                <button id="closePlayer" class="close-player" aria-label="Fechar">✕</button>
                <div id="playerWrapper"></div>
            </div>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="js/filter-3-modal.js"></script>
    
</body>
</html>
